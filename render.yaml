services:
  - type: web
    name: ai-news-video-generator
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: ENABLE_DAILY_SCHEDULER
        value: "false"
      - key: VIDEO_RESOLUTION
        value: "720p"
      - key: FFMPEG_THREADS
        value: "1"
      - key: GNEWS_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false


